<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAD Admin — Leads</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090909;--panel:#111;--line:#292929;--text:#f4efe7;--muted:#96928c;--red:#d61e26;--gold:#c8a76b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}.wrap{max-width:1240px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-weight:800;letter-spacing:.13em}.brand b{color:var(--red)}.muted{color:var(--muted)}.login{max-width:420px;margin:12vh auto;padding:34px;border:1px solid var(--line);background:var(--panel)}h1{font-size:26px;margin:0 0 8px}.field{margin:18px 0}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}.field input,.field select,.search{width:100%;background:#0b0b0b;border:1px solid var(--line);color:var(--text);padding:13px}.btn{border:0;background:var(--red);color:white;padding:12px 18px;cursor:pointer}.btn.alt{background:transparent;border:1px solid var(--line)}.error{color:#ff7479;font-size:13px;min-height:18px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{border:1px solid var(--line);background:var(--panel);padding:18px}.stat strong{display:block;font-size:28px}.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.tools{display:grid;grid-template-columns:1fr 180px 160px;gap:10px;margin-bottom:16px}.tablebox{overflow:auto;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:950px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:#0e0e0e;position:sticky;top:0}.pill{display:inline-block;border:1px solid var(--line);padding:4px 7px;text-transform:uppercase;font-size:9px;letter-spacing:.08em}.detail{white-space:pre-wrap;color:#c8c3bb;max-width:340px}.status{background:#0b0b0b;color:var(--text);border:1px solid var(--line);padding:7px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:750px){.wrap{padding:18px}.stats{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.top{align-items:flex-start;gap:16px}.top .right{text-align:right}}
</style></head><body>
<div id="login" class="login"><div class="brand">MANILA AUTO <b>DEAL</b></div><h1 style="margin-top:26px">Admin Login</h1><p class="muted">Authorized team access only.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div id="loginError" class="error"></div><button class="btn" type="submit">Sign In</button></form></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div><div class="brand">MANILA AUTO <b>DEAL</b></div><div class="muted" style="margin-top:5px">Private Lead Management</div></div><div class="right"><span id="who" class="muted"></span> <button id="logout" class="btn alt">Log out</button></div></div>
<div class="stats"><div class="stat"><strong id="sAll">0</strong><span>Total Leads</span></div><div class="stat"><strong id="sNew">0</strong><span>New</span></div><div class="stat"><strong id="sOffers">0</strong><span>Offers</span></div><div class="stat"><strong id="sSell">0</strong><span>Cars to Sell</span></div></div>
<div class="tools"><input id="search" class="search" placeholder="Search name, phone, email, vehicle..."><select id="type" class="search"><option value="">All lead types</option><option>offer</option><option>sell</option><option>source</option><option>viewing</option><option>concierge</option></select><button id="refresh" class="btn alt">Refresh</button></div>
<div class="tablebox"><table><thead><tr><th>Date</th><th>Type</th><th>Customer</th><th>Vehicle / Details</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No submissions found.</div></div></div></div>
<script>
const CONFIG={supabaseUrl:"https://pxcnhpggvaistwbktvgb.supabase.co",anonKey:"sb_publishable_z00lh5Ud4bIm5M2HS-P2Gg_pjP_kOua"};
let sb, leads=[]; const $=id=>document.getElementById(id);
function configured(){return /^https:\/\/.+\.supabase\.co\/?$/.test(CONFIG.supabaseUrl)&&CONFIG.anonKey&&!CONFIG.anonKey.startsWith('YOUR_')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function detail(l){const p=l.payload||{};const omit=new Set(['name','mobile','email']);return Object.entries(p).filter(([k,v])=>!omit.has(k)&&v!==''&&v!=null).map(([k,v])=>`${k.replaceAll('_',' ')}: ${v}`).join('\n')}
async function boot(){if(!configured()){$('loginError').textContent='Configure Supabase URL and anon key in this file first.';return} sb=supabase.createClient(CONFIG.supabaseUrl,CONFIG.anonKey); const {data:{session}}=await sb.auth.getSession(); if(session) showApp(session.user); sb.auth.onAuthStateChange((_,s)=>s?showApp(s.user):showLogin())}
async function showApp(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||'';await load()}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function load(){const {data,error}=await sb.from('leads').select('*').order('created_at',{ascending:false}).limit(1000);if(error){alert(error.message);return}leads=data||[];render()}
function render(){const q=$('search').value.trim().toLowerCase(),type=$('type').value;let list=leads.filter(l=>(!type||l.lead_type===type));if(q)list=list.filter(l=>[l.customer_name,l.mobile,l.email,l.vehicle_name,JSON.stringify(l.payload)].join(' ').toLowerCase().includes(q));$('sAll').textContent=leads.length;$('sNew').textContent=leads.filter(x=>x.status==='new').length;$('sOffers').textContent=leads.filter(x=>x.lead_type==='offer').length;$('sSell').textContent=leads.filter(x=>x.lead_type==='sell').length;$('rows').innerHTML=list.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td><span class="pill">${esc(l.lead_type)}</span></td><td><b>${esc(l.customer_name)}</b><br>${esc(l.mobile)}<br><span class="muted">${esc(l.email)}</span></td><td><b>${esc(l.vehicle_name||'')}</b><div class="detail">${esc(detail(l))}</div></td><td><select class="status" data-id="${l.id}">${['new','contacted','negotiating','closed','lost'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');$('empty').classList.toggle('hidden',!!list.length);document.querySelectorAll('.status').forEach(x=>x.onchange=async()=>{const {error}=await sb.from('leads').update({status:x.value}).eq('id',x.dataset.id);if(error)alert(error.message);else{const a=leads.find(z=>z.id===x.dataset.id);if(a)a.status=x.value;render()}})}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';if(!configured()){$('loginError').textContent='Configure Supabase first.';return}if(!sb)sb=supabase.createClient(CONFIG.supabaseUrl,CONFIG.anonKey);const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginError').textContent=error.message};$('logout').onclick=()=>sb.auth.signOut();$('refresh').onclick=load;$('search').oninput=render;$('type').onchange=render;boot();
</script></body></html>
